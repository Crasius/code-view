name: Bug report
description: Something in Code View does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Do not file it here: report it privately as SECURITY.md in the repository says.
        Never paste an access token, a password or private repository content into an issue.
  - type: input
    id: version
    attributes:
      label: Code View version
      description: 'The number of the release you downloaded, as its release notes name it, or the commit you built. The app does not show it in its window; Windows shows it in the properties of `CodeView.exe` (Details, Product version), macOS in Get Info of `Code View.app`.'
      placeholder: The release number, or the commit you built
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows x64
        - Windows Arm64
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux x64
        - Linux arm64
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      description: The host of the pull request, if the problem is about one.
      options:
        - Not about a host
        - GitHub (github.com)
        - GitHub Enterprise Server
        - GitLab (gitlab.com)
        - GitLab self-managed
        - Azure DevOps Services
        - Azure DevOps Server
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pull request with ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error text
      description: 'The text of the error, if the app showed one: open Details under the error and click Copy details, or click Copy message on a notice. For a memory problem, the lines of `memory.log` from the time it grew (Windows: `%LOCALAPPDATA%\ReviewApp\logs`, macOS: `~/Library/Caches/ReviewApp/logs`, Linux: `$XDG_CACHE_HOME/ReviewApp/logs`, by default `~/.cache/ReviewApp/logs`); it holds numbers only. Remove any private names from the error text.'
      render: text
