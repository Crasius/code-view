# The quality check of a pull request on macOS: format, repository rules, lints and tests. GitHub
# is the public mirror; the main work and its pipeline are on GitLab (docs/release.md), so no push
# starts this workflow. A maintainer's manual run also packages Code View as a universal (Apple
# silicon + Intel) app bundle, signed ad hoc. See docs/macos.md for signing with a Developer ID
# and notarizing.
name: macOS

on:
  pull_request:
  workflow_dispatch:

# Pull requests come from anyone: the jobs only read the repository. Every action is pinned to a
# full commit SHA, its version in the comment; update both together.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    # Our own budget: the first complete run reached the last test crates after about 20 minutes,
    # so a hung test ends the job after 45 minutes instead of after GitHub's default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # repo-lint compares the length allowlist with the base or the pushed-over commit.
          fetch-depth: 0
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins (RS-DO-02), read from that file: it is the one place
      # that names the version.
      - id: pin
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      # RL002 compares the length allowlist with the pull request's base. A manual run has none
      # and compares with the parent commit.
      - name: Repository rules (tools/repo-lint)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null || BASE=HEAD~1
          cargo run --locked -p repo-lint -- --base "$BASE"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # --all-targets unifies the dev-dependency features, so the pass above lints every library
      # with test-support on. This pass lints the shipped variant: the only one that sees code
      # under cfg(not(any(test, feature = "test-support"))).
      - name: Clippy (shipped features)
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Native traffic-light alignment
        run: cargo run --locked -p cv-base --example check_macos_traffic_lights
      # The runner's Reduce Motion setting, which the app reads at start-up (cv-base
      # platform::prefers_reduced_motion); tests pin their own, this records what they run beside.
      - name: Host motion setting
        run: defaults read com.apple.universalaccess reduceMotion || echo "reduceMotion not set"
      # Every crate's tests, also after one fails, so one run lists every failure.
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast

  # Only a maintainer's manual run packages; a pull request needs the check alone.
  bundle:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: pin
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Build and package the universal app
        run: ./scripts/package-macos.sh --universal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeView-macos-universal
          path: |
            dist/CodeView-macos-universal.dmg
            dist/CodeView-macos-universal.zip
          if-no-files-found: error
