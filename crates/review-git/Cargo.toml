[package]
name = "review-git"
description = "Blob-less partial-clone mirrors and diff computation via the git CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# `ChangedFile::sample` for other crates' tests (src/changed_files.rs); enabled only from
# [dev-dependencies].
test-support = []

[dependencies]
review-core.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
