[package]
name = "cv-widgets"
description = "Code View's presentational widgets: data in, response out, no services and no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Test probes other crates' tests read (row::assert_centered_in, surfaces::clipping_regions,
# ProgressLog::lines). Enabled only from [dev-dependencies] and from the test-support features above.
test-support = ["cv-base/test-support"]

[dependencies]
cv-base.workspace = true
review-core.workspace = true
review-git.workspace = true
egui.workspace = true
# Log timestamps in the local time zone (progress_log::timestamp).
time = { workspace = true, features = ["local-offset"] }

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
egui_kittest.workspace = true
review-store.workspace = true
