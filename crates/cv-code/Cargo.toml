[package]
name = "cv-code"
description = "Code View's text diff code: diff rows, gaps, file contents and their colors, the code line source and the diff painter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Test probes other crates' tests read (the find marks and the current hit in find_paint, with
# their recording sites); forwards to the cv crates below. Enabled only from [dev-dependencies]
# and from the test-support features above.
test-support = [
    "cv-base/test-support",
    "cv-runtime/test-support",
    "cv-services/test-support",
    "cv-syntax/test-support",
    "cv-widgets/test-support",
]

[dependencies]
cv-base.workspace = true
cv-runtime.workspace = true
cv-services.workspace = true
cv-syntax.workspace = true
cv-widgets.workspace = true
review-core.workspace = true
review-git.workspace = true
egui.workspace = true
tokio.workspace = true

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
cv-runtime = { workspace = true, features = ["test-support"] }
cv-services = { workspace = true, features = ["test-support"] }
cv-syntax = { workspace = true, features = ["test-support"] }
cv-widgets = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
