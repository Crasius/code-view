[package]
name = "review-agent"
description = "Drives the signed-in Claude Code and Codex CLIs in their machine modes for the pull request assistant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# A scripted session for the app's walkthroughs: no process, no network.
test-support = []

[dependencies]
review-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

# Whole sessions against fake CLIs: the test binary is its own fake (tests/sessions.rs).
[[test]]
name = "sessions"
harness = false

[target."cfg(windows)".dependencies]
# The registry's current PATH: a CLI installed after the app (or Explorer) started is found too.
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }
