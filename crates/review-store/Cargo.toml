[package]
name = "review-store"
description = "Local persistence: connections with OS-protected tokens, viewed files, settings, log files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
review-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
base64.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true
