[package]
name = "cv-runtime"
description = "Code View's runtime: background tasks, loads, refresh, caches, toasts, routes, history, trail, link parsing and the cross-page mailboxes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Test probes other crates' tests read (toast texts and the opened folder, cache sizes, the
# refresh queue, the history's back routes) and the stubbed "Open folder"; forwards to the cv
# crates below. Enabled only from [dev-dependencies] and from the test-support features above.
test-support = ["cv-base/test-support", "cv-widgets/test-support"]

[dependencies]
cv-base.workspace = true
cv-widgets.workspace = true
review-core.workspace = true
review-git.workspace = true
review-store.workspace = true
egui.workspace = true
# The disk tier of the page cache stores host answers as JSON (src/cache/page_cache.rs).
serde_json.workspace = true
tokio.workspace = true
urlencoding.workspace = true

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
cv-widgets = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
egui_kittest.workspace = true
