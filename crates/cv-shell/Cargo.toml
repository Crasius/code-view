[package]
name = "cv-shell"
description = "Code View's window chrome without the title bar: navigation rail, breadcrumbs, focus mode, zoom, input, links, single instance and the browser extension's host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Test probes other crates' tests read (Attention::without_pauses, the focus mode's top lines,
# ClipboardWatch::set_source, Breadcrumbs::levels, the in-memory registry MemoryKeys); forwards to
# the cv crates below. Enabled only from [dev-dependencies] and from the test-support features above.
test-support = [
    "cv-base/test-support",
    "cv-runtime/test-support",
    "cv-services/test-support",
    "cv-widgets/test-support",
]

[dependencies]
cv-base.workspace = true
cv-runtime.workspace = true
cv-services.workspace = true
cv-widgets.workspace = true
review-core.workspace = true
review-store.workspace = true
eframe.workspace = true
egui.workspace = true
# Reads the clipboard when the window gains focus, for copied pull request links; eframe's own
# clipboard (the same crate) only answers a paste.
arboard.workspace = true
reqwest.workspace = true
# The browser extension's native messaging host speaks JSON (browser/).
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# The full list the app used before the split; trimming it waits for a `-p cv-shell` build. Named
# pipes with an owner-only DACL for the single instance, the registry for the native messaging
# host's keys.
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
cv-runtime = { workspace = true, features = ["test-support"] }
cv-services = { workspace = true, features = ["test-support"] }
cv-widgets = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
cv-providers.workspace = true
egui_kittest.workspace = true
# The fixture of links/access_writes_check.rs dates its summary with time::macros::datetime!.
time.workspace = true
