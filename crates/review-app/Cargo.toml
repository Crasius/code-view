[package]
name = "review-app"
description = "Native pull request review desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "CodeView"
path = "src/main.rs"

[features]
# wgpu as a second renderer, picked at run time with CODEVIEW_RENDERER=wgpu (docs/linux.md). Off by
# default: the app ships glow only.
wgpu = ["eframe/wgpu"]
# The measurement tests (heap curves over long sessions, src/app/memory_walkthrough.rs), which the
# ordinary `cargo test` leaves out; rule `testing`, Running. Adds no code to the app.
measurements = []

[dependencies]
# The crates main.rs, app.rs and title_bar/ name; cv-providers builds the hosts' providers.
cv-base.workspace = true
cv-editor.workspace = true
cv-lists.workspace = true
cv-markdown.workspace = true
cv-media.workspace = true
cv-pr-page.workspace = true
cv-pr-session.workspace = true
cv-providers.workspace = true
cv-runtime.workspace = true
cv-services.workspace = true
cv-settings.workspace = true
cv-shell.workspace = true
cv-widgets.workspace = true
review-core.workspace = true
review-store.workspace = true
eframe.workspace = true
egui.workspace = true
# The client the provider factory of `ReviewApp::new` is handed.
reqwest.workspace = true

[dev-dependencies]
# The walkthroughs run the whole app on the libraries' test fakes (agents, clipboard, dialogs) and
# read their probes; every cv library's `test-support` switches them on.
cv-base = { workspace = true, features = ["test-support"] }
cv-code = { workspace = true, features = ["test-support"] }
cv-editor = { workspace = true, features = ["test-support"] }
cv-lists = { workspace = true, features = ["test-support"] }
cv-markdown = { workspace = true, features = ["test-support"] }
cv-media = { workspace = true, features = ["test-support"] }
cv-pr-assistant = { workspace = true, features = ["test-support"] }
cv-pr-diff = { workspace = true, features = ["test-support"] }
cv-pr-files = { workspace = true, features = ["test-support"] }
cv-pr-page = { workspace = true, features = ["test-support"] }
cv-pr-rendered = { workspace = true, features = ["test-support"] }
cv-pr-session = { workspace = true, features = ["test-support"] }
cv-runtime = { workspace = true, features = ["test-support"] }
cv-services = { workspace = true, features = ["test-support"] }
cv-settings = { workspace = true, features = ["test-support"] }
cv-shell = { workspace = true, features = ["test-support"] }
cv-syntax = { workspace = true, features = ["test-support"] }
cv-widgets = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
egui_kittest = { workspace = true, features = ["eframe"] }
# Walkthroughs drive the assistant with a scripted session, no CLI process.
review-agent = { workspace = true, features = ["test-support"] }
review-git.workspace = true
provider-gitlab.workspace = true
async-trait.workspace = true
# Also the icon renderer (examples/render_icon.rs).
image.workspace = true
# The icon renderer draws the SVG masters (examples/render_icon.rs).
resvg.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
urlencoding.workspace = true
wiremock.workspace = true

# Without a Windows-only cfg: a build dependency's cfg reads the host, and the release build
# cross-compiles for Windows on Linux (build.rs).
[build-dependencies]
winresource.workspace = true
