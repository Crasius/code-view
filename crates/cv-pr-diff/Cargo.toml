[package]
name = "cv-pr-diff"
description = "The text diff: the diff view, its find widget, the overview strip and the patch colors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Test helpers and probes for the tests of the crates above; enabled only from [dev-dependencies].
# `testing` drives the view in a kittest harness (egui_kittest) with threads of a fixed time (time),
# and the view notes its top line for the focus mode's probe (cv-shell).
test-support = [
    "dep:cv-shell",
    "dep:egui_kittest",
    "dep:time",
    "cv-base/test-support",
    "cv-code/test-support",
    "cv-editor/test-support",
    "cv-pr-session/test-support",
    "cv-pr-threads/test-support",
    "cv-runtime/test-support",
    "cv-shell/test-support",
    "cv-syntax/test-support",
    "cv-widgets/test-support",
]

[dependencies]
cv-base.workspace = true
cv-code.workspace = true
cv-editor.workspace = true
cv-pr-session.workspace = true
cv-pr-threads.workspace = true
cv-runtime.workspace = true
cv-shell = { workspace = true, optional = true }
cv-syntax.workspace = true
cv-widgets.workspace = true
egui.workspace = true
egui_kittest = { workspace = true, optional = true }
review-core.workspace = true
review-git.workspace = true
review-store.workspace = true
similar.workspace = true
time = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
cv-code = { workspace = true, features = ["test-support"] }
cv-editor = { workspace = true, features = ["test-support"] }
cv-pr-session = { workspace = true, features = ["test-support"] }
cv-pr-threads = { workspace = true, features = ["test-support"] }
cv-runtime = { workspace = true, features = ["test-support"] }
cv-shell = { workspace = true, features = ["test-support"] }
cv-syntax = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
cv-widgets = { workspace = true, features = ["test-support"] }
egui_kittest.workspace = true
review-git = { workspace = true, features = ["test-support"] }
time.workspace = true
