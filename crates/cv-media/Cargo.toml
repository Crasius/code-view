[package]
name = "cv-media"
description = "Code View's media: the image store and decoding, image copies to the clipboard, video playback, Mermaid diagrams and the picture and image state the renderer draws."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# The fake clipboard and the in-process Mermaid renderer for other crates' tests (a test binary
# cannot start itself as the renderer), and the probes they read; forwards to the cv crates below.
# Enabled only from [dev-dependencies] and from the test-support features above.
test-support = ["cv-base/test-support", "cv-runtime/test-support"]

[dependencies]
cv-base.workspace = true
cv-runtime.workspace = true
review-agent.workspace = true
review-core.workspace = true
review-git.workspace = true
# Copies images to the system clipboard (src/image_clipboard.rs).
arboard.workspace = true
egui.workspace = true
image.workspace = true
mermaid-rs-renderer.workspace = true
# Text for SVG badges in rendered Markdown, set in the system's fonts; no raster images inside SVGs.
resvg = { workspace = true, features = ["text", "system-fonts"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
cv-runtime = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
wiremock.workspace = true
