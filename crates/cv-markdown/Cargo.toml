[package]
name = "cv-markdown"
description = "Code View's Markdown renderer for descriptions, comments and file previews: links, images, videos, Mermaid diagrams, tables and code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Forwards to the cv crates below, whose fakes and probes the tests of the crates above need.
# Enabled only from [dev-dependencies] and from the test-support features above.
test-support = [
    "cv-base/test-support",
    "cv-media/test-support",
    "cv-runtime/test-support",
    "cv-syntax/test-support",
    "cv-widgets/test-support",
]

[dependencies]
cv-base.workspace = true
cv-media.workspace = true
cv-runtime.workspace = true
cv-syntax.workspace = true
cv-widgets.workspace = true
review-core.workspace = true
egui.workspace = true
pulldown-cmark.workspace = true
# Image source hosts (src/images.rs).
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
cv-base = { workspace = true, features = ["test-support"] }
cv-media = { workspace = true, features = ["test-support"] }
cv-runtime = { workspace = true, features = ["test-support"] }
cv-syntax = { workspace = true, features = ["test-support"] }
cv-testkit.workspace = true
cv-widgets = { workspace = true, features = ["test-support"] }
egui_kittest.workspace = true
review-store.workspace = true
