# Code View CI/CD on the project's GitLab instance (docs/release.md, Pipelines).
# The one runner is shared and busy, so a pipeline runs only what verifies something not yet
# verified.
# Merge requests: lint (format, repository rules, both clippy passes) and test (the tests the change
# needs, scripts/affected-tests.sh) side by side on Linux and the Linux x64 release build when a
# cargo input changed (.rust-inputs, ci/checks.yml), and a secret scan always. The other platforms'
# builds wait for a manual start.
# main: every push runs the checks with every test and writes the build caches. No release build:
# the tag builds its own.
# A protected tag vX.Y.Z runs the checks and the release build of every platform and publishes the
# builds to Creative Downloads (cdl). The instance's only runner is Linux amd64, so the macOS,
# Windows and Linux arm64 builds are cross-builds.

workflow:
  # A new push to a merge request or a branch cancels its running pipeline, jobs that started
  # included: every job is interruptible but the publish.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Merge requests from this project only; fork merge requests never run on the shared runner.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    # A branch with an open merge request runs as the merge request pipeline, not twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # The pipelines of the protected branch main alone write the build caches: a push and a run by
    # hand. Every other pipeline only restores them (CACHE_POLICY in ci/checks.yml; docs/release.md,
    # Build cache).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages: [test, build, release]

include:
  - project: northbyte/creative-downloads/cli
    ref: v0.3.0
    file: templates/cdl.gitlab-ci.yml
  # The images, the defaults, .rust and the check jobs.
  - local: ci/checks.yml

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"

# ---------------- test ----------------
# The check jobs are in ci/checks.yml.

# ---------------- build ----------------
# After the test stage, so that a red commit spends no build time. Every platform on a tag and by
# hand; a merge request builds Linux x64 by itself only when what a release build adds to the checks
# changed (.release-inputs), and every platform on a manual start; a push to main builds nothing,
# since the release tag's pipeline builds and publishes its own (docs/release.md, Cut a release).
# What a release build checks beyond lint and test: the dependency set and its licenses
# (cargo-about stops on a license outside ci/about.toml), the release profile, the build scripts,
# the files ci/build-release.sh reads and the code only a release build compiles. A code change
# compiles in lint and test already; build-linux-x64 waits for a manual start then (8 to 13
# minutes, measured 2026-11-22 to 24).
.release-inputs:
  # The manifests (versions, [package.metadata.bundle], the release profile), the lockfile, the
  # toolchain and cargo's configuration.
  - Cargo.toml
  - Cargo.lock
  - crates/*/Cargo.toml
  - tools/*/Cargo.toml
  - rust-toolchain.toml
  - .cargo/**/*
  # Build scripts and what they read: review-app's icon (Windows resource; the macOS bundle's
  # .icns, the window icons main.rs embeds).
  - crates/*/build.rs
  - crates/review-app/assets/icon/**/*
  # Shipped code under cfg(not(debug_assertions)), which no debug build compiles:
  # `git grep -l debug_assertions -- 'crates/*.rs'` minus the test-only files.
  - crates/review-app/src/main.rs
  - crates/review-app/src/app.rs
  # The pipeline and the release scripts with what they read: the notices' licenses and the example
  # that prints the grammars' notices.
  - .gitlab-ci.yml
  - ci/checks.yml
  - ci/build-release.sh
  - ci/install-build-deps.sh
  - ci/about.*
  - crates/cv-base/assets/Phosphor-LICENSE-MIT.txt
  - crates/review-grammars/grammars/csharp-license.txt
  - crates/review-grammars/examples/grammar_notices.rs

.release-build:
  stage: build
  extends: .rust
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: !reference [.rust-inputs]
        compare_to: refs/heads/main
      when: manual
      allow_failure: true
  script:
    - sh ci/install-build-deps.sh cargo-about
    - sh ci/build-release.sh "$PLATFORM" "${CI_COMMIT_TAG:-}"
  artifacts:
    expire_in: 14 days
    paths: [dist/]

build-linux-x64:
  extends: .release-build
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: !reference [.release-inputs]
        compare_to: refs/heads/main
    - !reference [.release-build, rules]
  variables:
    PLATFORM: linux-x64

build-linux-arm64:
  extends: .release-build
  variables:
    PLATFORM: linux-arm64

build-macos:
  extends: .release-build
  variables:
    PLATFORM: macos

build-windows-x64:
  extends: .release-build
  image: $XWIN_IMAGE
  variables:
    PLATFORM: windows-x64

build-windows-arm64:
  extends: .release-build
  image: $XWIN_IMAGE
  variables:
    PLATFORM: windows-arm64

# ---------------- release ----------------
# The zigbuild image brings curl, tar, sha256sum and git, which the cdl installer and the release
# notes need.
creative-downloads:
  stage: release
  extends: [.cdl, .release-tag]
  image: $ZIGBUILD_IMAGE
  needs: [lint, test, secret-scan, build-linux-x64, build-linux-arm64, build-macos, build-windows-x64, build-windows-arm64]
  interruptible: false
  resource_group: creative-downloads
  variables:
    GIT_DEPTH: "0"
  script:
    - sh ci/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
    - sh ci/publish-creative-downloads.sh release-notes.md
  artifacts:
    paths: [publish.json, release-notes.md]
