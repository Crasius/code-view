# Code View CI/CD on the project's GitLab instance (docs/release.md, Pipelines).
# The one runner is shared and busy, so a pipeline runs only what verifies something not yet
# verified.
# Merge requests: lint (format, repository rules, both clippy passes) and test (the tests the change
# needs, scripts/affected-tests.sh) side by side on Linux and the Linux x64 release build when a
# cargo input changed (.rust-inputs, ci/checks.yml), and a secret scan always. The other platforms'
# builds wait for a manual start.
# main: the checks only when the pushed tree is not one a merge request pipeline passed
# (ci/main-scope.sh, a child pipeline). No release build: the tag builds its own.
# A protected tag vX.Y.Z runs the checks and the release build of every platform and publishes the
# builds to Creative Downloads (cdl). The instance's only runner is Linux amd64, so the macOS,
# Windows and Linux arm64 builds are cross-builds.

workflow:
  # A new push to a merge request or a branch cancels its running pipeline, jobs that started
  # included: every job is interruptible but the publish.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Merge requests from this project only; fork merge requests never run on the shared runner.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    # A branch with an open merge request runs as the merge request pipeline, not twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages: [test, build, release]

include:
  - project: northbyte/creative-downloads/cli
    ref: v0.3.0
    file: templates/cdl.gitlab-ci.yml
  # The images, the defaults, .rust and the check jobs, shared with main's child pipeline.
  - local: ci/checks.yml

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"

# ---------------- test ----------------
# The check jobs are in ci/checks.yml. A push to main does not run them here: main-scope compares
# the merge commit's tree with its second parent's, the merge request head whose pipeline passed,
# and writes the child pipeline main-checks starts: the checks when the trees differ, else one
# short job that names the merge request (ci/main-scope.sh). A rule cannot compare trees.
main-scope:
  stage: test
  image: $ZIGBUILD_IMAGE
  needs: []
  variables:
    # The merge commit and both its parents.
    GIT_DEPTH: "2"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - sh ci/main-scope.sh main-checks.yml
  artifacts:
    expire_in: 7 days
    paths: [main-checks.yml]

# The child's result is this pipeline's: main is green when its checks passed or its tree is a
# merge request's that passed.
main-checks:
  stage: test
  needs: [main-scope]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  trigger:
    include:
      - artifact: main-checks.yml
        job: main-scope
    strategy: depend
    # The child takes its variables from the files it includes, as this pipeline does.
    forward:
      yaml_variables: false

# ---------------- build ----------------
# After the test stage, so that a red commit spends no build time. Every platform on a tag and by
# hand; a merge request builds Linux x64 when a cargo input changed and the others on a manual
# start; a push to main builds nothing, since the release tag's pipeline builds and publishes its
# own (docs/release.md, Cut a release).
.release-build:
  stage: build
  extends: .rust
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: !reference [.rust-inputs]
        compare_to: refs/heads/main
      when: manual
      allow_failure: true
  script:
    - sh ci/install-build-deps.sh cargo-about
    - sh ci/build-release.sh "$PLATFORM" "${CI_COMMIT_TAG:-}"
  artifacts:
    expire_in: 14 days
    paths: [dist/]

build-linux-x64:
  extends: .release-build
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: !reference [.rust-inputs]
        compare_to: refs/heads/main
  variables:
    PLATFORM: linux-x64

build-linux-arm64:
  extends: .release-build
  variables:
    PLATFORM: linux-arm64

build-macos:
  extends: .release-build
  variables:
    PLATFORM: macos

build-windows-x64:
  extends: .release-build
  image: $XWIN_IMAGE
  variables:
    PLATFORM: windows-x64

build-windows-arm64:
  extends: .release-build
  image: $XWIN_IMAGE
  variables:
    PLATFORM: windows-arm64

# ---------------- release ----------------
# The zigbuild image brings curl, tar, sha256sum and git, which the cdl installer and the release
# notes need.
creative-downloads:
  stage: release
  extends: [.cdl, .release-tag]
  image: $ZIGBUILD_IMAGE
  needs: [lint, test, secret-scan, build-linux-x64, build-linux-arm64, build-macos, build-windows-x64, build-windows-arm64]
  interruptible: false
  resource_group: creative-downloads
  variables:
    GIT_DEPTH: "0"
  script:
    - sh ci/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
    - sh ci/publish-creative-downloads.sh release-notes.md
  artifacts:
    paths: [publish.json, release-notes.md]
