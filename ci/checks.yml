# The checks of a commit and what every pipeline of this project runs with (docs/release.md,
# Pipelines), included by .gitlab-ci.yml.

variables:
  # Images by digest; the tag only documents the version. rustup in the image installs the toolchain
  # rust-toolchain.toml pins.
  RUST_IMAGE: rust:1.99.1-bookworm@sha256:7085845219c18e7c5b1f34ed9ce89b84f822f2e3d54a02774cedc996ac0f304f
  ZIGBUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild:0.24.0@sha256:eb5578cfc06e070a09deb7b5852474bd128a4e561f9f123261b5ed2405e478b1
  XWIN_VERSION: "0.23.1"
  XWIN_IMAGE: ghcr.io/rust-cross/cargo-xwin:$XWIN_VERSION@sha256:9856b895265d4966f212228ba64802cf89337e2a2a537aa2533c1b8784cbc81b
  # Moves only the downloaded crates into the cache; rustup and the cargo plugins stay in the image.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  XWIN_CACHE_DIR: $CI_PROJECT_DIR/.xwin-cache
  BUILD_DEPS: $CI_PROJECT_DIR/.build-deps
  # Every cache only restores; the pipelines of main set pull-push in the workflow rules
  # (.gitlab-ci.yml), so a merge request or a tag never writes what main and the tags restore
  # (docs/release.md, Build cache).
  CACHE_POLICY: pull

default:
  tags: [build]
  interruptible: true
  retry:
    max: 2
    # The reasons that replaced stuck_or_timeout_failure (deprecated in GitLab 19.1).
    when:
      - runner_system_failure
      - scheduler_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling

# What a cargo job can depend on, a coarse filter: a merge request that changes none of them, a
# docs-only one, runs no cargo job. The pipeline's own files are on the list, so a CI change runs
# the jobs it defines.
.rust-inputs:
  - crates/**/*
  - tools/**/*
  - browser-extension/**/*
  - .cargo/**/*
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - clippy.toml
  - rustfmt.toml
  - .gitlab-ci.yml
  - ci/**/*
  - .agents/hooks/**/*
  - .config/**/*
  - .gitattributes
  - scripts/affected-tests.sh
  - scripts/check.sh
  - deny.toml

# The downloads every cargo job shares, keyed by the lockfile; lint and test write them in main's
# pipelines (CACHE_POLICY), every other job only reads them. YAML anchors, since a !reference
# cannot replace one key of what it names.
.cargo-downloads: &cargo-downloads
  key:
    prefix: cargo-downloads
    files: [Cargo.lock]
  paths: [.cargo-home/registry/index, .cargo-home/registry/cache, .cargo-home/git/db]

.rust:
  image: $ZIGBUILD_IMAGE
  timeout: 1h
  variables:
    # Keeps the build folder inside the runner's disk limit (docs/release.md, Runner).
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
  before_script:
    - export PATH="$BUILD_DEPS/usr/bin:$PATH"
  # The release builds read main's downloads; cargo fetches only the crates that link on their
  # target alone, which lint and test on Linux never download.
  cache:
    - <<: *cargo-downloads
      policy: pull
  after_script:
    - du -sh target .cargo-home .xwin-cache .build-deps 2>/dev/null || true

# The two Windows builds: the image with cargo-xwin and its download of the Windows SDK and CRT,
# one cache per job. Only a run by hand on main writes it (CACHE_POLICY), since main's pushes build
# nothing; the key names the image's version.
.xwin-build:
  image: $XWIN_IMAGE
  cache:
    - <<: *cargo-downloads
      policy: pull
    - key: xwin-$XWIN_VERSION-$CI_JOB_NAME_SLUG
      policy: $CACHE_POLICY
      paths: [.xwin-cache]

# lint and test run side by side, each in its own pod, each with its own build cache: clippy's
# check artifacts and the test build share no compiled unit (docs/release.md, Build cache). The
# image is the one of docs/linux.md (Tests in a container): its git and its DejaVu fonts are all
# the tests need. In a merge request only when a cargo input changed; on main, a tag and a run by
# hand always: a rule's `changes` on a push compares with the commit before it and would skip what
# an earlier red or cancelled push changed.
.cargo-checks:
  stage: test
  extends: .rust
  image: $RUST_IMAGE
  needs: []
  rules:
    # A scheduled pipeline runs supply-chain alone.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: !reference [.rust-inputs]
        compare_to: refs/heads/main
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  variables:
    # The test selection compares with the merge request's base, which must be in the clone.
    GIT_DEPTH: "50"
    # Restoring test's two archives took 72 to 76 s with one stream each [observed 2026-11-26].
    FF_USE_PARALLEL_CACHE_TRANSFER: "true"
  before_script:
    - export PATH="$BUILD_DEPS/usr/bin:$PATH"
    - rustup show active-toolchain || rustup toolchain install
    - sh ci/target-stamp.sh restore
  after_script:
    - du -sh target .cargo-home 2>/dev/null || true
    - sh ci/target-stamp.sh drop-if-cheap

# `target` of one job kind: keyed by the lockfile and the toolchain, so a dependency or toolchain
# change starts that kind cold. Only main's pipelines write them (CACHE_POLICY); a cache of an older
# commit of main is safe (ci/target-stamp.sh). Each archive stays below the runner's upload limit of
# 1 GiB (docs/release.md, Runner). The measurements read test's caches with the policy pull.
.target-test: &target-test
  key:
    prefix: target-test
    files: [Cargo.lock, rust-toolchain.toml]
  when: always
  paths:
    - target/ci-tree.txt
    - target/ci-build-id
    - target/debug/.fingerprint
    - target/debug/build
    - target/debug/examples
    - target/debug/deps/*.*

.target-test-bins: &target-test-bins
  key:
    prefix: target-test-bins
    files: [Cargo.lock, rust-toolchain.toml]
  when: always
  paths:
    - target/ci-build-id-bins
    - target/debug/deps/*-????????????????

# The default steps of scripts/check.sh (format, hygiene, repository rules, the clippy passes, the
# dependency bans and sources, rustdoc) and its step shear (ci/lint.sh).
lint:
  extends: .cargo-checks
  variables:
    # repo-lint compares the length allowlist with every version on main (ci/repo-lint-base.sh).
    GIT_DEPTH: "0"
  cache:
    - <<: *cargo-downloads
      policy: $CACHE_POLICY
    # The root's *.toml: the toolchain, the workspace manifest and clippy.toml, whose lint settings
    # a warm clippy run would not read again. A key takes at most two entries.
    - key:
        prefix: target-lint
        files: [Cargo.lock, "*.toml"]
      policy: $CACHE_POLICY
      # Only what drop-if-cheap removes, so that a kept cache leaves nothing to archive.
      paths: [target/ci-tree.txt, target/ci-build-id, target/ci-build-id-bins, target/debug]
  script:
    - sh ci/install-build-deps.sh cargo-deny cargo-shear
    - sh ci/lint.sh

# Every test the change needs, with cargo-nextest (ci/test.sh). Its `target` zips to about 1.2 GB,
# above the runner's upload limit of 1 GiB [observed 2026-11-26, pipeline 4900], so it is two
# archives: the test executables (deps/<name>-<16 hex>, no extension) and everything else. Each
# carries the build id of ci/target-stamp.sh, which deletes the executables when the two differ.
test:
  extends: .cargo-checks
  cache:
    - <<: *cargo-downloads
      policy: $CACHE_POLICY
    - <<: *target-test
      policy: $CACHE_POLICY
    - <<: *target-test-bins
      policy: $CACHE_POLICY
  script:
    - sh ci/install-build-deps.sh cargo-nextest
    - sh ci/test.sh
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: target/nextest/ci/junit.xml

# review-app's heap measurements (ci/measurements.sh), beside test in main's pipelines and by hand
# in a merge request; never on a tag and never on GitHub. They read test's cache and write none,
# so on a warm cache they build only what the feature changes and end before test.
measurements:
  extends: .cargo-checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  cache:
    - <<: *cargo-downloads
      policy: pull
    - <<: *target-test
      policy: pull
    - <<: *target-test-bins
      policy: pull
  script:
    - sh ci/install-build-deps.sh cargo-nextest
    - sh ci/measurements.sh

# The supply chain (scripts/check.sh advisories licenses): the RustSec advisories of the locked
# crates, and the licences of the crates that link on each of the six shipped targets, which the
# release build checks again (ci/notices.sh). It compiles nothing. Advisories appear without a
# commit, so it also runs alone in a scheduled pipeline. In a merge request only when the
# dependency set, its configuration or the scripts it runs changed.
supply-chain:
  stage: test
  extends: .rust
  image: $RUST_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - Cargo.lock
          - Cargo.toml
          - crates/*/Cargo.toml
          - tools/*/Cargo.toml
          - deny.toml
          - ci/about.*
          - ci/install-build-deps.sh
          - ci/notices.sh
          - scripts/check.sh
        compare_to: refs/heads/main
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  script:
    - rustup show active-toolchain || rustup toolchain install
    - sh ci/install-build-deps.sh cargo-deny cargo-about
    - sh scripts/check.sh advisories licenses

# Secret scan of the full git history, in every pipeline that checks. Findings are redacted in the
# job log.
secret-scan:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --no-banner --verbose "$CI_PROJECT_DIR"
